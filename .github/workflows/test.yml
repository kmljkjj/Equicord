name: Test
on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


            - name: Cache pnpm store
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.local/share/pnpm/store
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-store-${{ runner.os }}-

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24

            - name: Setup pnpm
              run: npm install -g pnpm@12.8.1

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # each check is its own step so failures are immediately visible
            # and CI never auto-fixes the code (lint runs without --fix)

            - name: Build desktop version
              run: pnpm buildStandalone

            - name: Typecheck
              run: pnpm testTsc

            - name: Lint
              run: pnpm lint

            - name: Lint styles
              run: pnpm lint-styles

            - name: Lint intl
              run: pnpm lint:intl

            - name: Lint patches
              run: pnpm lint:patches

            - name: Test if web version compiles
              run: pnpm buildWeb

            - name: Test if plugin structure is valid
              run: pnpm generatePluginJson

            # the restore step never writes the cache on its own; save it
            # explicitly so cold runs stop re-downloading every dependency
            - name: Save pnpm store cache
              if: github.ref == 'refs/heads/main' && success()
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.local/share/pnpm/store
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
              continue-on-error: true
