name: Test
on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7


            - name: Cache pnpm store
              uses: actions/cache/restore@v4
              with:
                  path: ~/.local/share/pnpm/store
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-store-${{ runner.os }}-

            - name: Setup PNPM
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@v24
                  require-lockfile: true

            # each check is its own step so failures are immediately visible
            # and CI never auto-fixes the code (lint runs without --fix)

            - name: Build desktop version
              run: pnpm buildStandalone

            - name: Typecheck
              run: pnpm testTsc

            - name: Lint
              run: pnpm lint

            - name: Lint styles
              run: pnpm lint-styles

            - name: Lint intl
              run: pnpm lint:intl

            - name: Lint patches
              run: pnpm lint:patches

            - name: Test if web version compiles
              run: pnpm buildWeb

            - name: Test if plugin structure is valid
              run: pnpm generatePluginJson

            # the restore step never writes the cache on its own; save it
            # explicitly so cold runs stop re-downloading every dependency
            - name: Save pnpm store cache
              if: github.ref == 'refs/heads/main' && success()
              uses: actions/cache/save@v4
              with:
                  path: ~/.local/share/pnpm/store
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
              continue-on-error: true
